<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>NFA Passbook</title>
<meta name="description" content="Offline-first NFA Farmer &amp; Master Passbook management, QR delivery recording, and procurement analytics.">
<meta name="theme-color" content="#003366">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://cdnjs.cloudflare.com">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<script>
  // Mobile browsers (esp. iOS/Android Chrome) report 100vh taller than what's
  // actually visible because it ignores the address bar / toolbar. This computes
  // the real usable height in pixels and exposes it as --app-vh (1% of it), so
  // CSS can do calc(var(--app-vh) * 100) for a height that never overflows.
  function setAppViewportHeight() {
    document.documentElement.style.setProperty('--app-vh', (window.innerHeight * 0.01) + 'px');
  }
  setAppViewportHeight();
  window.addEventListener('resize', setAppViewportHeight);
  window.addEventListener('orientationchange', () => setTimeout(setAppViewportHeight, 100));
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', setAppViewportHeight);
  }
</script>
<div id="app-root"></div>

<!-- Third-party libraries (offline database, QR generation, QR scanning) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/dexie/3.2.4/dexie.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>

<!-- Application modules -->
<script src="js/core.js"></script>
<script src="js/geo.js"></script>
<script src="js/db.js"></script>
<script src="js/sync.js"></script>
<script src="js/qr.js"></script>
<script src="js/delivery.js"></script>
<script src="js/screens-dashboard.js"></script>
<script src="js/screens-passbook-list.js"></script>
<script src="js/screens-passbook-form.js"></script>
<script src="js/screens-passbook-wizard.js"></script>
<script src="js/screens-passbook-detail.js"></script>
<script src="js/screens-scan-result.js"></script>
<script src="js/screens-scan.js"></script>
<script src="js/screens-reports.js"></script>
<script src="js/screens-settings.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>

<script>
  // IMPORTANT: A previous version of this app registered a Service Worker for
  // offline support. If your device visited it before, that old Service Worker
  // is still installed and may be serving STALE cached files (old CSS/JS) even
  // after this page is updated. This block actively finds and removes it so
  // your device always gets the latest version. Once the app is stable for
  // production rollout, offline caching can be safely re-enabled — see sw.js.
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations().then((registrations) => {
      registrations.forEach((reg) => reg.unregister());
    });
  }
  if ('caches' in window) {
    caches.keys().then((keys) => keys.forEach((key) => caches.delete(key)));
  }
</script>
</body>
</html>
