<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>NFA Passbook</title>
<meta name="description" content="Offline-first NFA Farmer &amp; Master Passbook management, QR delivery recording, and procurement analytics.">
<meta name="theme-color" content="#003366">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://cdnjs.cloudflare.com">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<script>
  // Mobile browsers (esp. iOS/Android Chrome) report 100vh taller than what's
  // actually visible because it ignores the address bar / toolbar. This computes
  // the real usable height in pixels and exposes it as --app-vh (1% of it), so
  // CSS can do calc(var(--app-vh) * 100) for a height that never overflows.
  function setAppViewportHeight() {
    document.documentElement.style.setProperty('--app-vh', (window.innerHeight * 0.01) + 'px');
  }
  setAppViewportHeight();
  window.addEventListener('resize', setAppViewportHeight);
  window.addEventListener('orientationchange', () => setTimeout(setAppViewportHeight, 100));
</script>
<div id="app-root"></div>

<!-- Third-party libraries (offline database, QR generation, QR scanning) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/dexie/3.2.4/dexie.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.js"></script>

<!-- Application modules -->
<script src="js/core.js"></script>
<script src="js/geo.js"></script>
<script src="js/db.js"></script>
<script src="js/sync.js"></script>
<script src="js/qr.js"></script>
<script src="js/delivery.js"></script>
<script src="js/screens-dashboard.js"></script>
<script src="js/screens-passbook-list.js"></script>
<script src="js/screens-passbook-form.js"></script>
<script src="js/screens-passbook-detail.js"></script>
<script src="js/screens-scan.js"></script>
<script src="js/screens-reports.js"></script>
<script src="js/screens-settings.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => { /* offline-first still works via Dexie */ });
    });
  }
</script>
</body>
</html>
